services:
  nginx:
    container_name: catalog_nginx
    build: ./docker/nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html:ro,Z
    depends_on:
      - php
    networks:
      - app

  php:
    container_name: catalog_php
    build:
      dockerfile: ./docker/php/Dockerfile
      context: .
    volumes:
      - ./www:/var/www/html:Z
    networks:
      - app
    environment:
      - TMPDIR=/tmp

  mysql:
    container_name: catalog_mysql
    build: ./docker/mysql
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - app

  redis:
    image: redis:latest
    container_name: catalog_redis
    ports:
      - "6379:6379"
    networks:
      - app

networks:
  app:

volumes:
  db:
